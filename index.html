<!DOCTYPE html>
<html lang="az" id="html-root">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="img/favicon.png" />
    <title>Nəzrin Osmanova – Portfolio</title>
    <link rel="stylesheet" href="style.css" />
</head>

<body>
    <div class="layout">

        <!-- ── LEFT SIDEBAR ── -->
        <aside class="sidebar">
            <div class="sidebar-top" id="sidebar-top"></div>

            <nav>
                <div class="nav-group">
                    <div class="nav-label">Əsas</div>
                    <button class="nav-item" data-section="haqqimda">
                        <span class="nav-icon">◈</span> Haqqımda
                    </button>
                </div>

                <div class="nav-group">
                    <div class="nav-label">Karyera</div>
                    <button class="nav-item" data-section="tehsil">
                        <span class="nav-icon">◈</span> Təhsil
                    </button>
                    <button class="nav-item" data-section="tecrube">
                        <span class="nav-icon">◈</span> Təcrübə
                    </button>
                    <button class="nav-item" data-section="konullu">
                        <span class="nav-icon">◈</span> Könüllü Təcrübə
                    </button>
                </div>

                <div class="nav-group">
                    <div class="nav-label">Bacarıqlar</div>
                    <button class="nav-item" data-section="texniki-bacariqlar">
                        <span class="nav-icon">◈</span> Texniki Bacarıqlar
                    </button>
                    <button class="nav-item" data-section="yumsaq-bacariqlar">
                        <span class="nav-icon">◈</span> Yumşaq Bacarıqlar
                    </button>
                </div>

                <div class="nav-group">
                    <div class="nav-label">Əlavə</div>
                    <button class="nav-item" data-section="layiheler">
                        <span class="nav-icon">◈</span> Şəxsi Layihələr
                    </button>
                    <button class="nav-item" data-section="sertifikatlar">
                        <span class="nav-icon">◈</span> Sertifikatlar
                    </button>
                    <button class="nav-item" data-section="diller">
                        <span class="nav-icon">◈</span> Dil Bilikləri
                    </button>
                </div>
            </nav>

            <div class="sidebar-controls">
                <button class="ctrl-btn active-lang" id="btn-az" onclick="setLang('az')">AZ</button>
                <button class="ctrl-btn" id="btn-en" onclick="setLang('en')">EN</button>
                <button class="theme-toggle" id="theme-toggle" onclick="toggleTheme()" title="Tema dəyiş">🌙</button>
            </div>
        </aside>

        <!-- ── MAIN CONTENT ── -->
        <main class="main">
            <section class="section" id="haqqimda"></section>
            <section class="section" id="tehsil"></section>
            <section class="section" id="tecrube"></section>
            <section class="section" id="konullu"></section>
            <section class="section" id="texniki-bacariqlar"></section>
            <section class="section" id="yumsaq-bacariqlar"></section>
            <section class="section" id="layiheler"></section>
            <section class="section" id="sertifikatlar"></section>
            <section class="section" id="diller"></section>
        </main>

    </div>

    <script src="data.js"></script>
    <script src="script.js"></script>
</body>

</html>
